<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Track</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="game">
        <h2>Game Track</h2>

        <!-- Formulário para Cadastro (POST) e Edição (PUT) -->
        <form id="form-jogo">
            <input type="text" id="titulo" placeholder="Título do jogo" required>
            <input type="text" id="genero" placeholder="Gênero" required>
            <input type="text" id="plataforma" placeholder="Plataforma" required>
            <input type="number" id="nota" placeholder="Nota" min="0" max="10" required>
            <button type="submit" id="btn-salvar">Salvar Jogo</button>
        </form>

        <!-- Lista onde os cards dos jogos serão inseridos -->
        <ul id="lista"></ul>
    </section>

    <script src="index.js"></script>
</body>
</html>
